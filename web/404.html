<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5e75"><title>페이지를 찾을 수 없습니다 | BlowerFit KR</title><style>body{margin:0;background:#f3f7f9;color:#17232b;font-family:system-ui,"Noto Sans KR",sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(560px,calc(100% - 36px));background:#fff;border:1px solid #d8e3e8;border-radius:24px;padding:36px;box-shadow:0 18px 46px rgba(20,52,66,.11)}.mark{width:54px;height:54px;border-radius:14px;background:#0b5e75;color:white;display:grid;place-items:center;font-weight:900}h1{font-size:32px;margin:22px 0 8px}p{color:#62717c;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#0b5e75;color:white}.secondary{background:#edf4f6;color:#17232b}</style></head><body><main class="box"><div class="mark">BF</div><h1>페이지를 찾을 수 없습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 경로입니다. GitHub Pages에서는 BlowerFit KR의 해시 라우팅 경로로 이동할 수 있습니다.</p><div class="actions"><button class="primary" onclick="go('selector')">선정 계산기로</button><button class="secondary" onclick="history.back()">이전 페이지</button><button class="secondary" onclick="go('products')">제품 검색</button></div></main><script>function base(){if(location.hostname.endsWith('github.io')){const p=location.pathname.split('/').filter(Boolean);return p.length?'/'+p[0]+'/':'/'}return '/'}function go(r){location.href=base()+'#/'+r}</script></body></html>
